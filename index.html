<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM de Pedidos y Refacciones - Toshiba</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .critical-row { background-color: #fee2e2 !important; }
        .critical-badge {
            background-color: #dc2626;
            color: white;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-scroll-wrapper::-webkit-scrollbar {
            height: 14px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 7px;
            border: 3px solid #f1f5f9;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-16">

    <!-- Header Principal -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="w-[98%] mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <!-- Logotipo Oficial de Toshiba Optimizado y Destacado -->
                <div class="bg-white px-4 py-2 rounded-lg shadow-inner flex items-center justify-center">
                    <span class="text-red-600 font-black text-2xl tracking-tighter leading-none" style="font-family: Arial, sans-serif;">TOSHIBA</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">CRM de Pedidos y Refacciones</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-cloud-arrow-down text-green-400"></i> Estado: <span id="fileNameDisplay" class="font-semibold text-blue-300">Cargando 'Pedidos.xlsx'...</span>
                    </p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="loadAutomaticExcel()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-rotate"></i> Actualizar Datos
                </button>
                <label class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-sm font-medium cursor-pointer transition flex items-center gap-2">
